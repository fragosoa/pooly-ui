<!-- @dsCard group="Spacing" viewport="700x180" name="Radius" subtitle="Squared → moderate (8–12px). The defining rebrand move." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px 26px; background: var(--surface); display: flex; gap: 22px; flex-wrap: wrap; align-items: flex-end; }
  .r { text-align: center; }
  .box { width: 72px; height: 56px; background: var(--brand-soft); border: 1.5px solid var(--brand); }
  .nm { font-size: 11.5px; font-weight: 700; color: var(--text-primary); margin-top: 8px; }
  .px { font-size: 11px; font-family: var(--font-mono); color: var(--text-muted); }
</style>
</head>
<body>
  <div class="r"><div class="box" style="border-radius:var(--radius-xs)"></div><div class="nm">xs</div><div class="px">4px</div></div>
  <div class="r"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="nm">sm · inputs</div><div class="px">6px</div></div>
  <div class="r"><div class="box" style="border-radius:var(--radius-md)"></div><div class="nm">md · controls</div><div class="px">8px</div></div>
  <div class="r"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="nm">lg · cards</div><div class="px">12px</div></div>
  <div class="r"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="nm">xl · panels</div><div class="px">16px</div></div>
  <div class="r"><div class="box" style="width:56px;border-radius:var(--radius-round)"></div><div class="nm">round</div><div class="px">avatars</div></div>
</body>
</html>
