<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px 26px; background: var(--surface); }
  .spec { display: flex; align-items: baseline; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .spec:last-child { border-bottom: none; }
  .tag { flex: 0 0 84px; font-size: 11px; font-family: var(--font-mono); color: var(--text-muted); }
  .ex { color: var(--text-primary); }
</style>
</head>
<body>
<div class="spec"><span class="tag">display 56</span><span class="ex" style="font:var(--font-display)">Insights en 5 min</span></div>
<div class="spec"><span class="tag">h1 · 36/800</span><span class="ex" style="font:var(--font-h1)">Escucha a tus clientes</span></div>
<div class="spec"><span class="tag">h2 · 30/700</span><span class="ex" style="font:var(--font-h2)">De respuestas a decisiones</span></div>
<div class="spec"><span class="tag">title · 20/600</span><span class="ex" style="font:var(--font-title)">Tiempo de entrega</span></div>
</body>
</html>
