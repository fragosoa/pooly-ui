<!-- @dsCard group="Type" viewport="700x220" name="Body, labels & mono" subtitle="Reading text, eyebrows, timestamps" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px 26px; background: var(--surface); }
  .spec { display: flex; align-items: baseline; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .spec:last-child { border-bottom: none; }
  .tag { flex: 0 0 96px; font-size: 11px; font-family: var(--font-mono); color: var(--text-muted); }
  .lead { font: var(--font-regular); font-size: var(--text-md); color: var(--text-secondary); line-height: var(--leading-relaxed); max-width: 460px; }
</style>
</head>
<body>
<div class="spec"><span class="tag">lead · 17</span><span class="lead">La IA entiende lo que tus clientes realmente piensan — sin que tengas que leer cada respuesta.</span></div>
<div class="spec"><span class="tag">body · 16</span><span style="font:var(--font-body);color:var(--text-primary)">Cada análisis trae sentimiento, urgencia y una acción recomendada.</span></div>
<div class="spec"><span class="tag">small · 14</span><span style="font:var(--font-small);color:var(--text-secondary)">142 menciones · 31% del total</span></div>
<div class="spec"><span class="tag">eyebrow · 12</span><span style="font:var(--font-eyebrow);text-transform:uppercase;letter-spacing:var(--tracking-wider);color:var(--brand)">Voz del cliente</span></div>
<div class="spec"><span class="tag">mono · 12</span><span style="font-family:var(--font-mono);font-size:12px;color:var(--text-muted)">pooly.mx/r/lumo-post-compra</span></div>
</body>
</html>
