<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pooly — Panel</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
<style>
  html, body { margin: 0; background: var(--surface-sunken); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="AppShell.jsx" data-presets="react"></script>
<script type="text/babel" src="Dashboard.jsx" data-presets="react"></script>
<script type="text/babel" src="SurveyBuilder.jsx" data-presets="react"></script>
<script type="text/babel" src="EventDetails.jsx" data-presets="react"></script>
<script type="text/babel" data-presets="react">
  function App() {
    // #report deep-link: used by the marketing landing to embed the AI-report view
    const [screen, setScreen] = React.useState(() =>
      window.location.hash === "#report"
        ? { name: "event", ev: window.PoolyData.events[0], analyzed: true }
        : { name: "dashboard" }
    );

    const goDashboard = () => setScreen({ name: "dashboard" });
    const openEvent = (ev) => { window.scrollTo(0, 0); setScreen({ name: "event", ev }); };
    const create = () => { window.scrollTo(0, 0); setScreen({ name: "create" }); };

    return (
      <div>
        <window.PoolyNavbar
          active="dashboard"
          onNav={(id) => { if (id === "create") create(); else goDashboard(); }}
        />
        {screen.name === "dashboard" && <window.PoolyDashboard onOpen={openEvent} onCreate={create} />}
        {screen.name === "create" && <window.PoolySurveyBuilder onBack={goDashboard} onCreated={() => openEvent(window.PoolyData.events[0])} />}
        {screen.name === "event" && <window.PoolyEventDetails ev={screen.ev} defaultAnalyzed={screen.analyzed} onBack={goDashboard} />}
      </div>
    );
  }

  function mount() {
    if (!window.PoolyDashboard || !window.PoolyNavbar) { return setTimeout(mount, 30); }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  }
  mount();
</script>
</body>
</html>
