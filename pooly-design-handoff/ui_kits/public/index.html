<!-- @startingPoint section="Pooly app" subtitle="Shopper-facing response screen (chat-style, mobile-first)" viewport="440x780" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pooly — Tu opinión</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  html, body { margin: 0; }
  /* Warm, light canvas — softer than the admin app. */
  body { background: var(--orange-50); min-height: 100vh; }
  .stage { max-width: 560px; margin: 0 auto; min-height: 100vh; background: var(--surface); border-left: 1px solid var(--border); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
  const { Icon, Button, Textarea, ChatOption, ProgressBar, Avatar } = window.PoolyDesignSystem_3787fa;

  const QUESTIONS = [
    { type: "open", q: "¿Qué te hizo dudar antes de comprar?", ph: "Escribe lo que se te venga a la mente…" },
    { type: "choice", q: "¿Cómo fue recibir tu pedido?", options: ["Llegó antes de lo esperado", "A tiempo", "Tardó más de lo que esperaba"] },
    { type: "open", q: "¿Qué podríamos mejorar para la próxima?", ph: "Tu respuesta nos ayuda a decidir qué cambiar…" },
  ];

  function Header({ step, total }) {
    return (
      <div style={{ position: "sticky", top: 0, zIndex: 10, background: "var(--surface)", borderBottom: "1px solid var(--border)", padding: "14px 20px", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 14 }}>
        <span style={{ fontFamily: "var(--font-sans)", fontWeight: 800, fontSize: 19, letterSpacing: "-0.02em", color: "var(--text-primary)" }}>
          Pool<span style={{ color: "var(--brand)" }}>y</span>
        </span>
        <div style={{ flex: 1, maxWidth: 200 }}>
          <ProgressBar value={step} max={total} />
        </div>
        <span style={{ fontSize: 12.5, fontWeight: 700, color: "var(--text-secondary)" }}>{Math.min(step + 1, total)}/{total}</span>
      </div>
    );
  }

  function Bubble({ children }) {
    return (
      <div style={{ display: "flex", gap: 12, marginBottom: 16 }}>
        <span style={{ width: 36, height: 36, flexShrink: 0, borderRadius: "var(--radius-round)", background: "var(--brand)", color: "#fff", display: "inline-flex", alignItems: "center", justifyContent: "center" }}>
          <Icon name="message-circle" size={18} />
        </span>
        <div style={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: "var(--radius-lg)", padding: "14px 16px", boxShadow: "var(--shadow-sm)", flex: 1 }}>
          {children}
        </div>
      </div>
    );
  }

  function Intro({ onStart }) {
    return (
      <div style={{ flex: 1, display: "flex", flexDirection: "column", justifyContent: "center", padding: "40px 28px", textAlign: "center" }}>
        <div style={{ width: 64, height: 64, margin: "0 auto 20px", borderRadius: "var(--radius-xl)", background: "var(--brand-soft)", color: "var(--brand)", display: "inline-flex", alignItems: "center", justifyContent: "center" }}>
          <Icon name="shopping-bag" size={30} />
        </div>
        <div style={{ font: "var(--font-eyebrow)", textTransform: "uppercase", letterSpacing: "0.1em", color: "var(--brand)", marginBottom: 10 }}>Tienda Lumo</div>
        <h1 style={{ margin: "0 0 12px", fontSize: 26, fontWeight: 800, letterSpacing: "-0.02em", color: "var(--text-primary)", lineHeight: 1.2 }}>Cuéntanos sobre tu compra</h1>
        <p style={{ margin: "0 auto 28px", maxWidth: 380, fontSize: 16, color: "var(--text-secondary)", lineHeight: 1.6 }}>
          Son 3 preguntas rápidas y anónimas. Tu respuesta nos ayuda a decidir qué mejorar de verdad.
        </p>
        <div>
          <Button variant="action" size="lg" rightIcon="arrow-right" onClick={onStart}>Empezar — toma 1 min</Button>
        </div>
        <div style={{ display: "flex", justifyContent: "center", gap: 18, marginTop: 24, fontSize: 12.5, color: "var(--text-muted)" }}>
          <span style={{ display: "inline-flex", alignItems: "center", gap: 5 }}><Icon name="lock" size={14} /> Anónimo</span>
          <span style={{ display: "inline-flex", alignItems: "center", gap: 5 }}><Icon name="zap" size={14} /> Sin crear cuenta</span>
        </div>
      </div>
    );
  }

  function Success() {
    return (
      <div style={{ flex: 1, display: "flex", flexDirection: "column", justifyContent: "center", alignItems: "center", padding: "40px 28px", textAlign: "center" }}>
        <div style={{ width: 80, height: 80, marginBottom: 20, borderRadius: "var(--radius-round)", background: "var(--success-soft)", color: "var(--success)", display: "inline-flex", alignItems: "center", justifyContent: "center" }}>
          <Icon name="check" size={40} />
        </div>
        <h1 style={{ margin: "0 0 10px", fontSize: 24, fontWeight: 800, color: "var(--text-primary)" }}>¡Gracias!</h1>
        <p style={{ margin: "0 auto", maxWidth: 320, fontSize: 16, color: "var(--text-secondary)", lineHeight: 1.6 }}>
          Tu opinión llega directo al equipo de Tienda Lumo y ayuda a decidir qué mejorar.
        </p>
      </div>
    );
  }

  function Flow() {
    const [phase, setPhase] = React.useState("intro"); // intro | q | done
    const [step, setStep] = React.useState(0);
    const [text, setText] = React.useState("");
    const [choice, setChoice] = React.useState(null);

    const total = QUESTIONS.length;
    const cur = QUESTIONS[step];

    const next = () => {
      if (step + 1 >= total) { setPhase("done"); return; }
      setStep(step + 1); setText(""); setChoice(null);
    };

    const canContinue = cur && (cur.type === "open" ? text.trim().length > 0 : choice != null);

    return (
      <div className="stage">
        <Header step={phase === "done" ? total : step} total={total} />
        {phase === "intro" && <Intro onStart={() => setPhase("q")} />}
        {phase === "done" && <Success />}
        {phase === "q" && (
          <div style={{ flex: 1, display: "flex", flexDirection: "column", padding: "28px 22px" }}>
            <Bubble>
              <div style={{ font: "var(--font-eyebrow)", textTransform: "uppercase", letterSpacing: "0.04em", color: "var(--brand)", marginBottom: 6 }}>Pregunta {step + 1}</div>
              <div style={{ fontSize: 17, fontWeight: 700, color: "var(--text-primary)", lineHeight: 1.4 }}>{cur.q}</div>
            </Bubble>

            <div style={{ paddingLeft: 48, flex: 1 }}>
              {cur.type === "open" ? (
                <Textarea chat rows={4} placeholder={cur.ph} value={text} onChange={(e) => setText(e.target.value)} autoFocus />
              ) : (
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {cur.options.map((o, i) => (
                    <ChatOption key={i} selected={choice === i} onSelect={() => setChoice(i)}>{o}</ChatOption>
                  ))}
                </div>
              )}
            </div>

            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 24, paddingTop: 16, borderTop: "1px solid var(--border)" }}>
              <span style={{ fontSize: 12.5, color: "var(--text-muted)", display: "inline-flex", alignItems: "center", gap: 6 }}>
                <Icon name="lock" size={14} /> Respuesta anónima
              </span>
              <Button variant="primary" rightIcon={step + 1 >= total ? "check" : "arrow-right"} disabled={!canContinue} onClick={next}>
                {step + 1 >= total ? "Enviar" : "Siguiente"}
              </Button>
            </div>
          </div>
        )}
        <div style={{ textAlign: "center", padding: "14px", fontSize: 11.5, color: "var(--text-muted)", borderTop: "1px solid var(--border)" }}>
          Powered by <strong style={{ color: "var(--text-secondary)" }}>Pool<span style={{ color: "var(--brand)" }}>y</span></strong>
        </div>
      </div>
    );
  }

  function mount() {
    if (!window.PoolyDesignSystem_3787fa) { return setTimeout(mount, 30); }
    ReactDOM.createRoot(document.getElementById("root")).render(<Flow />);
  }
  mount();
</script>
</body>
</html>
