<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pooly — Escucha a tus clientes</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  html, body { margin: 0; background: var(--surface); }
  .lp-container { max-width: 1160px; margin: 0 auto; padding: 0 32px; }
  .lp-narrow { max-width: 760px; margin: 0 auto; }
  .lp-nav { position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,0.9); backdrop-filter: saturate(160%) blur(8px); border-bottom: 1px solid var(--border); }
  .lp-nav-inner { display: flex; align-items: center; height: 66px; }
  .lp-wm { font-family: var(--font-sans); font-weight: 800; font-size: 22px; letter-spacing: -0.02em; color: var(--text-primary); }
  .lp-wm span { color: var(--brand); }
  .lp-login { font-size: 14px; font-weight: 600; color: var(--text-secondary); text-decoration: none; padding: 8px 12px; border-radius: var(--radius-md); white-space: nowrap; }
  .lp-login:hover { color: var(--text-primary); background: var(--surface-alt); }
  .lp-hero { padding: 88px 0 64px; text-align: center; }
  .lp-h1 { font-size: clamp(38px, 4.6vw, 56px); font-weight: 800; line-height: 1.08; letter-spacing: -0.025em; color: var(--text-primary); margin: 0 auto 22px; max-width: 820px; }
  .lp-h1 em { font-style: normal; color: var(--brand); }
  .lp-sub { font-size: 18px; color: var(--text-secondary); line-height: 1.65; max-width: 580px; margin: 0 auto 34px; }
  .lp-note { margin-top: 14px; font-size: 13px; color: var(--text-muted); }
  .lp-shot { border: 1px solid var(--border); border-radius: var(--radius-xl); box-shadow: var(--shadow-xl); overflow: hidden; background: var(--surface); }
  .lp-shot img { display: block; width: 100%; height: auto; }
  .lp-shot-bar { display: flex; align-items: center; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--surface-sunken); }
  .lp-shot-bar i { width: 10px; height: 10px; border-radius: 50%; background: var(--gray-300); }
  .lp-section { padding: 88px 0; }
  .lp-tint { background: var(--surface-sunken); }
  .lp-center { text-align: center; }
  .lp-eyebrow { font: var(--font-eyebrow); text-transform: uppercase; letter-spacing: 0.1em; color: var(--brand); display: block; margin-bottom: 14px; }
  .lp-h2 { font-size: clamp(28px, 3vw, 38px); font-weight: 800; line-height: 1.15; letter-spacing: -0.02em; color: var(--text-primary); margin: 0 0 16px; }
  .lp-h2.on-dark { color: #fff; }
  .lp-lead { font-size: 17px; color: var(--text-secondary); line-height: 1.7; max-width: 560px; margin: 0 auto; }
  .lp-pains { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 48px; }
  .lp-how { display: grid; grid-template-columns: 0.9fr 1.1fr; gap: 56px; align-items: center; margin-top: 56px; }
  .lp-step { display: flex; gap: 18px; align-items: flex-start; }
  .lp-step + .lp-step { margin-top: 34px; }
  .lp-step-n { font-size: 34px; font-weight: 800; color: var(--brand-soft); line-height: 1; letter-spacing: -0.02em; flex-shrink: 0; width: 52px; -webkit-text-stroke: 1.5px var(--brand); }
  .lp-logos { display: flex; align-items: center; justify-content: center; gap: 48px; flex-wrap: wrap; margin: 40px 0 28px; }
  .lp-logo { font-weight: 800; font-size: 20px; color: var(--gray-400); letter-spacing: -0.02em; }
  .lp-faq { max-width: 720px; margin: 48px auto 0; display: flex; flex-direction: column; gap: 12px; }
  .lp-faq details { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 0 22px; transition: border-color var(--dur-base) var(--ease-standard); }
  .lp-faq details[open] { border-color: var(--brand); }
  .lp-faq summary { cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 18px 0; font-size: 15.5px; font-weight: 700; color: var(--text-primary); }
  .lp-faq summary::-webkit-details-marker { display: none; }
  .lp-faq summary::after { content: "+"; font-size: 20px; font-weight: 400; color: var(--text-muted); flex-shrink: 0; }
  .lp-faq details[open] summary::after { content: "–"; color: var(--brand); }
  .lp-faq p { margin: 0; padding: 0 0 20px; font-size: 14.5px; color: var(--text-secondary); line-height: 1.65; }
  .lp-cta-band { background: var(--gray-900); padding: 90px 0; text-align: center; }
  .lp-footer { background: var(--gray-950); padding: 52px 0 40px; }
  .lp-footer-grid { display: flex; justify-content: space-between; align-items: flex-start; gap: 40px; flex-wrap: wrap; }
  .lp-footer a { font-size: 14px; color: var(--gray-400); text-decoration: none; }
  .lp-footer a:hover { color: #fff; }
  @media (max-width: 900px) {
    .lp-pains { grid-template-columns: 1fr; }
    .lp-how { grid-template-columns: 1fr; gap: 40px; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
  const { Icon, Button, Card, Badge } = window.PoolyDesignSystem_3787fa;

  const DEMO_URL = "#agendar-demo"; // → Calendly en producción
  const SPOTS_LEFT = 7; // actualizar manualmente (o hacer dinámico)

  // Live, scaled-down embed of the real admin app — sharper than a raster capture.
  function AppEmbed({ src, height, label }) {
    const ref = React.useRef(null);
    const [w, setW] = React.useState(0);
    React.useEffect(() => {
      const el = ref.current;
      if (!el) return;
      const ro = new ResizeObserver(() => setW(el.clientWidth));
      ro.observe(el);
      setW(el.clientWidth);
      return () => ro.disconnect();
    }, []);
    const scale = w ? w / 1280 : 0;
    return (
      <div ref={ref} style={{ position: "relative", width: "100%", height: scale ? Math.round(height * scale) : 240, overflow: "hidden" }}>
        {scale > 0 && (
          <iframe src={src} title={label} loading="lazy" tabIndex={-1} aria-hidden="true"
            style={{ width: 1280, height: height, transform: `scale(${scale})`, transformOrigin: "0 0", border: 0, pointerEvents: "none", display: "block" }}></iframe>
        )}
      </div>
    );
  }

  function Nav() {
    return (
      <nav className="lp-nav">
        <div className="lp-container lp-nav-inner">
          <span className="lp-wm">Pool<span>y</span></span>
          <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 12 }}>
            <a className="lp-login" href="#">Iniciar sesión</a>
            <Button variant="action" size="sm" as="a" href={DEMO_URL} rightIcon="arrow-right">Agendar demo</Button>
          </div>
        </div>
      </nav>
    );
  }

  function Hero() {
    return (
      <header className="lp-hero">
        <div className="lp-container">
          <h1 className="lp-h1">Escucha lo que tus clientes realmente piensan — <em>sin leer cada respuesta.</em></h1>
          <p className="lp-sub">
            Pooly analiza el feedback abierto de tus clientes con IA y te da temas,
            sentimiento y recomendaciones de acción en menos de 5 minutos.
          </p>
          <div style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
            <Button variant="action" size="lg" rightIcon="arrow-right" as="a" href={DEMO_URL}>Agendar tu demo gratis</Button>
            <div className="lp-note">Solo para early adopters — acceso desde $19 USD/mes</div>
          </div>
          <div className="lp-narrow" style={{ marginTop: 56, maxWidth: 880 }}>
            <div className="lp-shot">
              <div className="lp-shot-bar"><i></i><i></i><i></i></div>
              <AppEmbed src="../admin/index.html" height={720} label="Panel de Pooly: encuestas activas, respuestas y acción sugerida" />
            </div>
          </div>
        </div>
      </header>
    );
  }

  function Problem() {
    const pains = [
      { icon: "shopping-cart", t: "Carritos abandonados, cero contexto", d: "Tus clientes abandonan el carrito y nadie te explica por qué." },
      { icon: "star", t: "Reseñas que no dicen nada", d: "Recibes reseñas de 3 estrellas que solo dicen \u201cok\u201d." },
      { icon: "inbox", t: "Horas leyendo soporte", d: "Leer cada mensaje de soporte toma horas — y aun así no ves el patrón." },
    ];
    return (
      <section className="lp-section lp-tint">
        <div className="lp-container">
          <div className="lp-center">
            <span className="lp-eyebrow">El problema</span>
            <h2 className="lp-h2">¿Te suena familiar?</h2>
          </div>
          <div className="lp-pains">
            {pains.map((p) => (
              <Card key={p.icon} padding={26}>
                <span style={{ display: "inline-flex", width: 44, height: 44, borderRadius: "var(--radius-md)", background: "var(--brand-soft)", color: "var(--brand)", alignItems: "center", justifyContent: "center", marginBottom: 14 }}>
                  <Icon name={p.icon} size={22} />
                </span>
                <h3 style={{ margin: "0 0 8px", fontSize: 18, fontWeight: 700, color: "var(--text-primary)" }}>{p.t}</h3>
                <p style={{ margin: 0, fontSize: 14.5, color: "var(--text-secondary)", lineHeight: 1.6 }}>{p.d}</p>
              </Card>
            ))}
          </div>
        </div>
      </section>
    );
  }

  function HowItWorks() {
    const steps = [
      { n: "01", t: "Crea tu encuesta en 2 minutos", d: "Sin configuración técnica. Elige el momento: post-compra, post-entrega, devoluciones o soporte." },
      { n: "02", t: "Tu cliente responde desde el móvil", d: "Sin crear cuenta, en segundos, desde el link que tú le mandas." },
      { n: "03", t: "Pooly analiza todo automáticamente", d: "Temas emergentes, sentimiento, urgencia y recomendaciones de acción concretas." },
    ];
    return (
      <section className="lp-section" id="como">
        <div className="lp-container">
          <div className="lp-center">
            <span className="lp-eyebrow">Cómo funciona</span>
            <h2 className="lp-h2">Así funciona Pooly</h2>
          </div>
          <div className="lp-how">
            <div>
              {steps.map((s) => (
                <div className="lp-step" key={s.n}>
                  <span className="lp-step-n">{s.n}</span>
                  <div>
                    <h3 style={{ margin: "0 0 6px", fontSize: 19, fontWeight: 700, color: "var(--text-primary)" }}>{s.t}</h3>
                    <p style={{ margin: 0, fontSize: 14.5, color: "var(--text-secondary)", lineHeight: 1.6 }}>{s.d}</p>
                  </div>
                </div>
              ))}
            </div>
            <div className="lp-shot">
              <div className="lp-shot-bar"><i></i><i></i><i></i></div>
              <AppEmbed src="../admin/index.html#report" height={900} label="Reporte IA de Pooly: temas con sentimiento, urgencia y acción recomendada" />
            </div>
          </div>
        </div>
      </section>
    );
  }

  function Platforms() {
    return (
      <section style={{ padding: "64px 0", borderTop: "1px solid var(--border)", borderBottom: "1px solid var(--border)" }}>
        <div className="lp-container lp-center">
          <span className="lp-eyebrow">Compatibilidad</span>
          <h2 className="lp-h2" style={{ fontSize: 26 }}>Para marcas que venden en:</h2>
          <div className="lp-logos">
            {["Shopify", "Mercado Libre", "VTEX", "WooCommerce"].map((b) => (
              <span className="lp-logo" key={b}>{b}</span>
            ))}
            <span style={{ fontSize: 14, color: "var(--text-muted)" }}>…y cualquier otra plataforma</span>
          </div>
          <p className="lp-lead" style={{ fontSize: 15.5 }}>
            Si tienes una tienda online y quieres entender a tus clientes
            sin necesitar un equipo de analytics — Pooly es para ti.
          </p>
        </div>
      </section>
    );
  }

  function Pricing() {
    const feats = [
      "Encuestas ilimitadas",
      "Análisis con IA (temas, sentimiento, urgencia)",
      "Recomendaciones de acción automáticas",
      "Soporte directo con el equipo de Pooly",
    ];
    return (
      <section className="lp-section lp-tint" id="precios">
        <div className="lp-container lp-center">
          <span className="lp-eyebrow">Precio</span>
          <h2 className="lp-h2">Acceso Early Adopter</h2>
          <Card padding={36} elevated style={{ maxWidth: 440, margin: "44px auto 0", textAlign: "left", border: "2px solid var(--action)" }}>
            <div style={{ display: "flex", alignItems: "baseline", gap: 6 }}>
              <span style={{ fontSize: 52, fontWeight: 800, color: "var(--text-primary)", letterSpacing: "-0.02em", lineHeight: 1 }}>$19</span>
              <span style={{ fontSize: 16, color: "var(--text-secondary)" }}>USD / mes</span>
            </div>
            <div style={{ fontSize: 13, color: "var(--text-muted)", margin: "8px 0 22px" }}>Precio bloqueado de por vida</div>
            <ul style={{ listStyle: "none", margin: "0 0 22px", padding: 0, display: "flex", flexDirection: "column", gap: 11 }}>
              {feats.map((f) => (
                <li key={f} style={{ display: "flex", alignItems: "flex-start", gap: 9, fontSize: 14.5, color: "var(--text-secondary)", lineHeight: 1.45 }}>
                  <Icon name="check" size={16} color="var(--brand)" style={{ flexShrink: 0, marginTop: 2 }} /> {f}
                </li>
              ))}
            </ul>
            <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "10px 14px", background: "var(--action-tint)", border: "1px solid var(--action-soft)", borderRadius: "var(--radius-md)", marginBottom: 22 }}>
              <Icon name="zap" size={16} color="var(--action)" />
              <span style={{ fontSize: 13.5, fontWeight: 700, color: "var(--action)" }}>Solo quedan {SPOTS_LEFT} de 20 lugares disponibles</span>
            </div>
            <Button variant="action" size="lg" fullWidth rightIcon="arrow-right" as="a" href={DEMO_URL}>Quiero mi acceso early</Button>
          </Card>
        </div>
      </section>
    );
  }

  function FAQ() {
    const items = [
      { q: "¿Funciona con Shopify / Mercado Libre / VTEX / WooCommerce?", a: "Sí. Pooly funciona con cualquier plataforma — no requiere integración técnica. Tú creas la encuesta en Pooly y compartes el link con tus clientes por el canal que prefieras: email, WhatsApp, redes sociales o post-compra." },
      { q: "¿Mis clientes tienen que crear una cuenta para responder?", a: "No. Tu cliente abre el link, responde en texto libre y listo — sin registro, sin apps, desde su teléfono en menos de un minuto." },
      { q: "¿Cuánto tiempo toma configurar la primera encuesta?", a: "Menos de 2 minutos. Eliges el tipo de encuesta (post-compra, devoluciones, soporte), personalizas las preguntas si quieres, y obtienes el link para compartir." },
      { q: "¿Qué pasa con los datos de mis clientes?", a: "Los datos de tus clientes son tuyos. Pooly procesa las respuestas con IA para generar el análisis, pero no los usa para entrenar modelos ni los comparte con terceros." },
      { q: "¿En qué se diferencia de Typeform o Google Forms?", a: "Typeform y Google Forms recolectan respuestas — tú tienes que leerlas y analizarlas. Pooly cierra el loop: analiza automáticamente, identifica patrones y te dice qué hacer. La diferencia es entre tener datos y tener decisiones." },
    ];
    return (
      <section className="lp-section">
        <div className="lp-container">
          <div className="lp-center">
            <span className="lp-eyebrow">FAQ</span>
            <h2 className="lp-h2">Preguntas frecuentes</h2>
          </div>
          <div className="lp-faq">
            {items.map((it, i) => (
              <details key={i} open={i === 0}>
                <summary>{it.q}</summary>
                <p>{it.a}</p>
              </details>
            ))}
          </div>
        </div>
      </section>
    );
  }

  function FinalCTA() {
    return (
      <section className="lp-cta-band" id="agendar-demo">
        <div className="lp-container">
          <h2 className="lp-h2 on-dark" style={{ marginBottom: 14 }}>¿Tienes 20 minutos?</h2>
          <p style={{ fontSize: 18, color: "var(--gray-400)", marginBottom: 30, maxWidth: 520, marginLeft: "auto", marginRight: "auto", lineHeight: 1.6 }}>
            Te mostramos cómo funciona Pooly con datos reales de tu tienda.
          </p>
          <Button variant="action" size="lg" leftIcon="calendar" as="a" href="#">Agendar demo gratuita</Button>
        </div>
      </section>
    );
  }

  function Footer() {
    return (
      <footer className="lp-footer">
        <div className="lp-container lp-footer-grid">
          <div>
            <span className="lp-wm" style={{ color: "#fff" }}>Pool<span style={{ color: "var(--brand)" }}>y</span></span>
            <p style={{ fontSize: 13.5, color: "var(--gray-400)", lineHeight: 1.6, maxWidth: 260, margin: "12px 0 14px" }}>
              Voz del cliente para e-commerce. De respuestas abiertas a decisiones, en minutos.
            </p>
            <div style={{ fontSize: 13, color: "var(--gray-500)" }}>© 2026 Pooly · <a href="mailto:contacto@pooly.mx">contacto@pooly.mx</a></div>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 10, textAlign: "right" }}>
            <a href="#">Iniciar sesión</a>
            <a href="#">Política de privacidad</a>
            <a href="#">Términos de uso</a>
          </div>
        </div>
      </footer>
    );
  }

  function Landing() {
    return (
      <div>
        <Nav /><Hero /><Problem /><HowItWorks /><Platforms /><Pricing /><FAQ /><FinalCTA /><Footer />
      </div>
    );
  }

  function mount() {
    if (!window.PoolyDesignSystem_3787fa) { return setTimeout(mount, 30); }
    ReactDOM.createRoot(document.getElementById("root")).render(<Landing />);
  }
  mount();
</script>
</body>
</html>
